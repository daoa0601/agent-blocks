name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline gates (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-blocks
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.22.2
          - 24.15.0
    steps:
      # Sibling workspace repositories are checked out at their default branch; the catalog's
      # submodule pins are the reproducible record of a coordinated set.
      - &checkout-source
        name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: agent-blocks
          persist-credentials: false
      - &checkout-node-guardrails
        name: Check out Node Guardrails
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: node-guardrails
          persist-credentials: false
          repository: daoa0601/node-guardrails
      - &checkout-ts-quality
        name: Check out TypeScript Quality
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: ts-quality
          persist-credentials: false
          repository: daoa0601/ts-quality
      - &install-pnpm
        name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
          version: 11.13.1
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          cache-dependency-path: agent-blocks/pnpm-lock.yaml
          node-version: ${{ matrix.node-version }}
      # Installing also builds Node Guardrails and Agent Blocks through their prepare scripts.
      - &install-dependencies
        name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run offline quality gates
        run: pnpm quality:offline

  dependencies:
    name: Dependency trust gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-blocks
    steps:
      - *checkout-source
      - *checkout-node-guardrails
      - *checkout-ts-quality
      - *install-pnpm
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          cache-dependency-path: agent-blocks/pnpm-lock.yaml
          node-version: 24.15.0
      - *install-dependencies
      - name: Audit advisories and registry signatures
        run: pnpm deps:check
